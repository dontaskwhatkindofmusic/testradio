<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>test</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#050505;color:white;font:14px ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center}button{font:inherit;background:none;color:#fff;border:1px solid #fff;border-radius:999px;padding:18px 28px;letter-spacing:.14em}.s{margin-top:18px;font-size:12px;letter-spacing:.13em;color:#999}.t{font-size:11px;letter-spacing:.17em;color:#888;margin-bottom:28px}</style></head><body><main><div class=t>TEST</div><button id=b>TAP TO TUNE IN</button><div id=s class=s></div><audio id=a></audio></main><script type=module>import{joinRoom}from'https://esm.run/trystero';const S={"name":"test","room":"ef2293bbe08d6f83417be652d4e70f799841ef3263c96e360b9e2c2055e4192d","pub":{"crv":"P-256","ext":true,"key_ops":["verify"],"kty":"EC","x":"3T-rYdGPQrDjx44EOBsgEV_li1ChGhDlWjfw75xQp_I","y":"VB2y8dL4U94Lx7acwhOTkFwr9YazgwBALHUg-9xLL-U"},"offline":null},A='miniradio-static-v1',E=new TextEncoder(),b=document.querySelector('#b'),s=document.querySelector('#s'),a=document.querySelector('#a');let room,auth,nonces=new Map,good=new Set,pending=new Map,started=false,timer;async function verify(n,x){let k=await crypto.subtle.importKey('jwk',S.pub,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,new Uint8Array(x),E.encode(n))}function offline(){s.textContent='CURRENTLY OFFLINE';if(S.offline){a.src=S.offline;a.loop=true;a.play().catch(()=>{})}}function attach(st,id){if(!good.has(id)){pending.set(id,st);return}a.srcObject=st;a.play().catch(()=>{});s.textContent='● LIVE';b.style.display='none';clearTimeout(timer)}b.onclick=()=>{if(started)return;started=true;b.textContent='TUNING IN…';room=joinRoom({appId:A},S.room);auth=room.makeAction('auth');room.onPeerJoin=id=>{let n=crypto.randomUUID()+Math.random();nonces.set(id,n);auth.send({type:'challenge',nonce:n},{target:id})};room.onPeerStream=(st,id)=>attach(st,id);auth.onMessage=async(m,{peerId:id})=>{let n=nonces.get(id);if(m?.type==='proof'&&m.nonce===n&&await verify(n,m.sig)){good.add(id);if(pending.has(id)){attach(pending.get(id),id);pending.delete(id)}}};room.onPeerLeave=id=>{good.delete(id);pending.delete(id);if(!good.size)offline()};timer=setTimeout(offline,4000)}</script></body></html>
