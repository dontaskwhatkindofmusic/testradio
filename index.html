<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MiniRadio</title><style>html,body{height:100%;margin:0;background:#050505;color:#fff;font:14px ui-monospace,monospace}body{display:grid;place-items:center;text-align:center}button{padding:18px 28px;border:1px solid white;border-radius:999px;background:none;color:white;letter-spacing:.12em}.s{margin-top:18px;color:#999}.t{margin-bottom:25px;letter-spacing:.14em}</style></head><body><main><div class=t id=t></div><button id=b>TAP TO TUNE IN</button><div class=s id=s></div></main><script type=module>import {SimplePool} from 'https://esm.sh/nostr-tools@2.15.0/pool';const C={"Name":"new cool radio 2026","PubKey":"4142862cec7fbe4b09c7881b5086a0ee86615a88b18a84e5797c46b459b04ad6","StationID":"5d283c96769d419fbe3bdd177cdc5705","Relays":["wss://relay.damus.io","wss://nos.lol","wss://relay.primal.net"]},p=new SimplePool(),b=document.querySelector('#b'),s=document.querySelector('#s');document.querySelector('#t').textContent=C.Name.toUpperCase();b.onclick=async()=>{b.textContent='FINDING STATION…';s.textContent='Searching decentralized Nostr relays';try{let ev=await p.get(C.Relays,{kinds:[30333],authors:[C.PubKey],'#d':[C.StationID],limit:1});if(!ev)throw Error('No station announcement found');let x=JSON.parse(ev.content);if(!x.live||x.expires<Date.now())throw Error('Station is offline');location.href=x.url}catch(e){b.textContent='TRY AGAIN';s.textContent=e.message}}</script></body></html>
